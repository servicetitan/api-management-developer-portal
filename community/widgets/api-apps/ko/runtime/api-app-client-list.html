<div style="margin-bottom: 20px;">
    <a href="#" role="button" style="color: #141414; text-decoration: none;" data-bind="click: clickCancel">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" height="17px" width="17px" viewBox="0 0 24 24">
            <path d="M15.41 16.09l-4.58-4.59 4.58-4.59L14 5.5l-6 6 6 6z"></path>
        </svg>
        <span>Back to all apps</span>
    </a>
</div>
<div style="margin-bottom: 25px;">
    <!-- ko if: id == 0 -->
    <h3 style="margin: 0; font-size: 25px;">New App</h3>
    <!-- /ko -->
    <!-- ko if: id > 0 -->
    <div style="display: flex; align-items: center;">
        <div>
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="24" fill="#6954C0" />

        </div>
        <div style="padding-left: 17px;">
            <h3 style="margin: 0; font-size: 25px; margin-bottom: 4px;" data-bind="text: name"></h3>
            <div style="color: #777;" data-bind="text: 'App ID: ' + publicId">
            </div>
        </div>
    </div>
    <!-- /ko -->
</div>
<!-- ko if: isLoading -->
<div>
    <spinner></spinner>
</div>
<!-- /ko -->
<!-- ko ifnot: isLoading -->
<h4>App Connections</h4>
<table>
    <colgroup>
        <col width="175px">
        <col width="250px">
        <col width="175px">
        <col width="175px">
        <col width="125px">
    </colgroup>
    <thead>
        <tr>
            <th>Tenant/Network ID</th>
            <th>Client ID</th>
            <th>Client Secret</th>
            <th>API Scopes Version</th>
            <th>Allowed by Tenant</th>
        </tr>
    </thead>
    <tbody data-bind="foreach: clients">
        <tr>
            <td>
                <span data-bind="if: resourceOwnerTerm, attr: { title: resourceOwnerTerm }">🌐</span>
                <span data-bind="text: resourceOwner"></span>
            </td>
            <td data-bind="text: clientId || 'Not available yet'"></td>
            <td>
                <span data-bind="if: !clientSecrets.length">Not available yet</span>
                <!-- ko foreach: clientSecrets -->
                <div data-bind="text: `🗝 ${valuePrefix}...`"></div>
                <!-- /ko -->
            </td>
            <td data-bind="text: currentScopesVersion || $parent.currentScopesVersion"></td>
            <td data-bind="attr: { title: enabled ? 'Allowed' : 'Disallowed' }, style: { color: enabled ? '#18a761' : '#d1d7db', textAlign: 'center' }">⬤</td>
        </tr>
    </tbody>
</table>
<!-- /ko -->
